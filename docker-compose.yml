
services:
  uniassess-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uniassess-app:latest
    container_name: uniassess-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/teacher-profiles:/app/backend/teacher-profiles
      - ./backend/teacher-images:/app/backend/teacher-images
    environment:
      - NODE_ENV=production
      - PORT=5000
      # ─── REQUIRED: Set these before running ───────────────
      - MONGODB_URI=${MONGODB_URI}        # e.g. mongodb+srv://user:pass@cluster.mongodb.net/uniassess
      - JWT_SECRET=${JWT_SECRET}          # strong random string
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # ─── Email / SMTP ────────────────────────────────────
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-Examassess <noreply@examassess.com>}
      # ─── Frontend URLs ───────────────────────────────────
      - FRONTEND_URL=${FRONTEND_URL:-http://192.168.1.192:5000}
      - INVITATION_LOGIN_URL=${INVITATION_LOGIN_URL:-http://192.168.1.192:5000/login}
